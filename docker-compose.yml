services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: pedidos
      POSTGRES_USER: pedidos
      POSTGRES_PASSWORD: pedidos
    ports:
      - "5432:5432"

  artemis:
    image: apache/activemq-artemis:2.37.0
    environment:
      ARTEMIS_USER: artemis
      ARTEMIS_PASSWORD: artemis
    ports:
      - "61616:61616"   # protocolo de mensajería
      - "8161:8161"     # consola web: http://localhost:8161

  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "9092:9092"
