spring.application.name=huerta-camel
spring.main.banner-mode=off
server.port=8888
server.servlet.context-path=/huerta-camel

#POOL DE CONEXIONES (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.pool-name=huerta-camel-db-pool

#POSTGRESQL 18
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# Hibernate schema generation/application none, update or validate
spring.jpa.hibernate.ddl-auto=validate

#FLYWAY
spring.flyway.schemas=public
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
spring.flyway.table=flyway_schema_history

# ActiveMQ Artemis
spring.artemis.mode=native
spring.artemis.broker-url=tcp://localhost:61616
spring.artemis.user=artemis
spring.artemis.password=artemis

# Kafka
camel.component.kafka.brokers=localhost:9092

#ACTUATOR
management.endpoints.web.base-path=/api
management.endpoints.web.exposure.include=health,info

# Propiedades propias de la app
app.hola.periodo=10000
app.jms.cola-pedidos=pedidos
app.kafka.topico-pedidos=pedidos
